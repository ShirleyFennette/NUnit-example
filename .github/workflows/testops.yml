name: TestOps tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ALLURE_ENDPOINT: https://testing.qatools.cloud
  ALLURE_TOKEN: 325e6a7b-f52d-4bae-9da0-32d67cdc3c63
  ALLURE_PROJECT_ID: '1605'
  ALLURECTL_VERSION: '2.18.0'

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      launch_id: ${{ steps.tests.outputs.launch_id }}
    env:
      ALLURE_JOB_RUN_UID: ${{ github.run_id }}-${{ github.run_attempt }}-unit-tests
      ALLURE_LAUNCH_NAME: ${{ github.repository }} - unit - ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare
        run: |
          python -m pip install -r requirements.txt
          curl -fsSL "https://github.com/allure-framework/allurectl/releases/download/${ALLURECTL_VERSION}/allurectl_linux_amd64" -o allurectl
          chmod +x allurectl
      - name: Test and upload
        id: tests
        shell: bash
        run: |
          unset ALLURE_JOB_RUN_ID ALLURE_LAUNCH_ID
          export ALLURE_RESULTS="${RUNNER_TEMP}/allure-results"
          ./allurectl watch -- python -m pytest tests/unit --alluredir="$ALLURE_RESULTS"
          job_env="$(./allurectl job-run env)"
          pattern="(^|[[:space:]])ALLURE_LAUNCH_ID=['\"]?([1-9][0-9]*)['\"]?([[:space:]]|$)"
          [[ "$job_env" =~ $pattern ]] || { echo "Missing Launch ID"; exit 1; }
          launch_id="${BASH_REMATCH[2]}"
          echo "Launch ID: $launch_id"
          echo "launch_id=$launch_id" >> "$GITHUB_OUTPUT"

  func-test:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALLURE_JOB_RUN_UID: ${{ github.run_id }}-${{ github.run_attempt }}-func-test
      ALLURE_LAUNCH_NAME: ${{ github.repository }} - functional - ${{ github.run_id }}-${{ github.run_attempt }}
      UNIT_LAUNCH: ${{ needs.unit-tests.outputs.launch_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare
        run: |
          python -m pip install -r requirements.txt
          curl -fsSL "https://github.com/allure-framework/allurectl/releases/download/${ALLURECTL_VERSION}/allurectl_linux_amd64" -o allurectl
          chmod +x allurectl
      - name: Test and upload
        id: tests
        shell: bash
        run: |
          unset ALLURE_JOB_RUN_ID ALLURE_LAUNCH_ID
          export ALLURE_RESULTS="${RUNNER_TEMP}/allure-results"
          ./allurectl watch -- python -m pytest tests/functional --alluredir="$ALLURE_RESULTS"
          job_env="$(./allurectl job-run env)"
          pattern="(^|[[:space:]])ALLURE_LAUNCH_ID=['\"]?([1-9][0-9]*)['\"]?([[:space:]]|$)"
          [[ "$job_env" =~ $pattern ]] || { echo "Missing Launch ID"; exit 1; }
          launch_id="${BASH_REMATCH[2]}"
          echo "Launch ID: $launch_id"
          [[ -n "$UNIT_LAUNCH" && "$launch_id" != "$UNIT_LAUNCH" ]] || { echo "Launches are not separate"; exit 1; }
          echo "Separate launches: $UNIT_LAUNCH and $launch_id" >> "$GITHUB_STEP_SUMMARY"
